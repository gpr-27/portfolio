# Render Blueprint — Node web service + Python AgentRouter bridge (Axon-compatible).
services:
  - type: web
    name: praneeth-portfolio
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install --include=dev && npm run build"
    startCommand: "npm start"
    envVars:
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AXON_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_DB
        value: portfolio
      - key: AGENTROUTER_USE_PYTHON_BRIDGE
        value: "true"
      - key: AGENTROUTER_USE_CYCLETLS
        value: "false"
      - key: CONTACT_TO
        value: praneethg1830@gmail.com
      - key: CONTACT_FROM
        value: "Portfolio <onboarding@resend.dev>"
      - key: CORS_ORIGINS
        value: "https://portfolio-black-six-34.vercel.app"
