# Render Blueprint — Docker (Node + Python3 for AgentRouter bridge).
services:
  - type: web
    name: praneeth-portfolio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # ── Secrets — set these in the Render dashboard (never committed) ──
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AXON_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # ── Non-secret config — committed here, applied automatically ──
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_DB
        value: portfolio
      - key: AGENTROUTER_USE_PYTHON_BRIDGE
        value: "true"
      - key: AGENTROUTER_USE_CYCLETLS
        value: "true"
      - key: CONTACT_TO
        value: praneethg1830@gmail.com
      - key: CONTACT_FROM
        value: "Portfolio <onboarding@resend.dev>"
