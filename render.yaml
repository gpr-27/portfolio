# Render Blueprint — Node web service + vendored Python deps for AgentRouter.
services:
  - type: web
    name: praneeth-portfolio
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npm install --include=dev &&
      npm run build &&
      python3 -m pip install -r backend/scripts/requirements.txt -t backend/scripts/pydeps
    startCommand: npm start
    envVars:
      # ── Secrets — set these in the Render dashboard (never committed) ──
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # ── Non-secret config — committed here, applied automatically ──
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_DB
        value: portfolio
      - key: AGENTROUTER_USE_PYTHON_BRIDGE
        value: "true"
      - key: AGENTROUTER_USE_CYCLETLS
        value: "false"
      - key: CONTACT_TO
        value: praneethg1830@gmail.com
      - key: CONTACT_FROM
        value: "Portfolio <onboarding@resend.dev>"
