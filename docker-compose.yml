services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: praneeth-portfolio
    container_name: praneeth-portfolio
    # Load runtime secrets/config from the root .env (Groq, MongoDB, Resend, etc.).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Default the in-container port to 3000; override by setting PORT in .env.
      PORT: ${PORT:-3000}
    # Map host:container. Respects PORT from .env for both sides.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
