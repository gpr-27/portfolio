name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -fsS -o /dev/null -w "%{http_code}" https://praneeth-portfolio-4j9i.onrender.com/
